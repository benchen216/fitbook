    <!--
      impeccable:direction seed=f04e12ff
      THESIS: 這套系統的內容本來就是格 — 課表是格、名額是格、30 天記點是 30 個格子。所以格線不藏起來當版面工具，而是留在畫面上成為設計本身，資訊從同一組格子長出來。拒絕的是「側邊欄＋白卡＋統計數字」那套管理後台預設排列。
      OWN-WORLD: Crouwel 藍 #0057FF、墨 #111111、格線 #E6EBF2、面 #F5F7FA。零圓角、1px 髮絲線、可見構造格線、45° 斜線作為唯一的作用中記號、+ 作為展開。顯示字為自架的 Archivo 寬體 125%（工業建構性格）配 Noto Sans TC 900，數字一律等寬。狀態不加底色、不加外框，只用文字色說話。
      STORY: 使用者看見自己的狀態被畫成格子 — 記了幾點、剩幾個名額、離開課還有多久 — 然後在同一格線上做出下一個動作。
      FIRST VIEWPORT: 巨型格線構造標題佔左半屏，五個角色是右側同一格線上的五個模組，各帶權限摘要與斜線作用記號；主要動作是選一個角色模組進入系統。
      FORM: Crouwel 格線字體樣本，使用者在方向決策頁上選定（擲骰分配為第 6 順位的場館白板，使用者改選此方向）。seed f04e12ff。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
