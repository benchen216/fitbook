<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/broadsheet-d1553512-e3b6-4d1d-9a99-c7008d70f65b/styles.css">
  <script src="_ds/broadsheet-d1553512-e3b6-4d1d-9a99-c7008d70f65b/_ds_bundle.js"></script>
  <style>body{margin:0;}</style>
</helmet>
<dc-import name="TopBar" variant="member" active-nav="課程列表" member-name="王小明" hint-size="100%,60px"></dc-import>
<div style="max-width:1080px;margin:0 auto;padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;gap:var(--space-6);font-family:var(--font-body);color:var(--color-text);box-sizing:border-box;">

  <div style="{{ noticeStyle }};display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;">
    <span>{{ noticeText }}</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:11px;opacity:0.7;">示範：預約資格</span>
      <div class="seg" style="font-size:12px;background:var(--color-bg);">
        <label class="seg-opt"><input type="radio" name="elig" checked="{{ eligible }}" onChange="{{ setEligible }}"></input>符合</label>
        <label class="seg-opt"><input type="radio" name="elig" checked="{{ notEligible }}" onChange="{{ setNotEligible }}"></input>不符合</label>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-4);">
    <sc-for list="{{ courses }}" as="c" hint-placeholder-count="6">
      <div style="border-left:4px solid {{ c.borderColor }};background:var(--color-neutral-50);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-4);display:flex;flex-direction:column;gap:10px;opacity:{{ c.opacity }};">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
          <div>
            <div style="font-family:var(--font-heading);font-size:17px;font-weight:600;">{{ c.title }}</div>
            <div style="font-size:12px;color:var(--color-neutral-600);">{{ c.branchCoach }}</div>
          </div>
          <span class="tag" style="{{ c.badgeStyle }}">{{ c.statusLabel }}</span>
        </div>

        <dl style="margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px;">
          <div style="display:flex;justify-content:space-between;"><dt style="color:var(--color-neutral-500);">開始時間</dt><dd style="margin:0;">{{ c.startTime }}</dd></div>
          <div style="display:flex;justify-content:space-between;"><dt style="color:var(--color-neutral-500);">距離開課</dt><dd style="margin:0;">{{ c.countdown }}</dd></div>
          <div style="display:flex;justify-content:space-between;"><dt style="color:var(--color-neutral-500);">名額</dt><dd style="margin:0;">{{ c.seats }}</dd></div>
          <div style="display:flex;justify-content:space-between;"><dt style="color:var(--color-neutral-500);">候補</dt><dd style="margin:0;">{{ c.waitlist }}</dd></div>
        </dl>

        <sc-if value="{{ c.showNote }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:12px;background:var(--color-accent-100);color:var(--color-accent-800);border-radius:var(--radius-md);padding:6px 10px;">{{ c.noteText }}</div>
        </sc-if>

        <div style="display:flex;gap:10px;margin-top:4px;">
          <sc-if value="{{ c.primaryEnabled }}" hint-placeholder-val="{{ true }}">
            <button class="btn btn-primary" onClick="{{ c.onPrimary }}" style="flex:1;">{{ c.primaryLabel }}</button>
          </sc-if>
          <sc-if value="{{ c.primaryDisabled }}" hint-placeholder-val="{{ false }}">
            <button class="btn btn-primary" disabled="{{ true }}" style="flex:1;">{{ c.primaryLabel }}</button>
          </sc-if>
          <sc-if value="{{ c.showCancel }}" hint-placeholder-val="{{ false }}">
            <button class="btn" onClick="{{ c.onCancel }}" style="color:oklch(50% 0.16 25);">取消</button>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    eligible: true,
    booked: { 4: true },
  };

  courseDefs = [
    { id: 1, title: '早晨重量訓練', branchCoach: '信義店｜陳建豪教練', status: 'OPEN', startTime: '明天 07:00', countdown: '18 小時後・60 分鐘', confirmed: 8, capacity: 12, wl: 0, wlCap: 5 },
    { id: 2, title: '進階拳擊有氧', branchCoach: '大安店｜林雅涵教練', status: 'WAITLIST_OPEN', startTime: '週三 19:00', countdown: '2 天後・50 分鐘', confirmed: 15, capacity: 15, wl: 3, wlCap: 8 },
    { id: 3, title: '熱瑜珈基礎', branchCoach: '板橋店｜蔡欣穎教練', status: 'WAITLIST_FULL', startTime: '週四 09:30', countdown: '3 天後・75 分鐘', confirmed: 12, capacity: 12, wl: 6, wlCap: 6 },
    { id: 4, title: '核心訓練營', branchCoach: '信義店｜陳建豪教練', status: 'STARTED', startTime: '今天 08:00', countdown: '已開始・45 分鐘', confirmed: 10, capacity: 10, wl: 0, wlCap: 4 },
    { id: 5, title: '拉丁舞入門', branchCoach: '大安店｜周書豪教練', status: 'ENDED', startTime: '昨天 18:00', countdown: '已結束・45 分鐘', confirmed: 9, capacity: 10, wl: 0, wlCap: 3 },
    { id: 6, title: '壺鈴體能', branchCoach: '板橋店｜蔡欣穎教練', status: 'CANCELLED', startTime: '週五 20:00', countdown: '已停課・50 分鐘', confirmed: 0, capacity: 12, wl: 0, wlCap: 0 },
  ];

  statusMeta = {
    OPEN: { label: '可預約', color: 'oklch(55% 0.13 150)', tint: 'oklch(94% 0.045 150)', text: 'oklch(30% 0.09 150)' },
    WAITLIST_OPEN: { label: '滿額・可候補', color: 'var(--color-process-yellow)', tint: 'color-mix(in srgb, var(--color-process-yellow) 20%, var(--color-bg))', text: 'color-mix(in srgb, var(--color-process-yellow) 60%, var(--color-text))' },
    WAITLIST_FULL: { label: '候補已滿', color: 'oklch(58% 0.16 25)', tint: 'oklch(94% 0.045 25)', text: 'oklch(32% 0.1 25)' },
    STARTED: { label: '已開始', color: 'var(--color-neutral-400)', tint: 'var(--color-neutral-200)', text: 'var(--color-neutral-700)' },
    ENDED: { label: '已結束', color: 'var(--color-neutral-400)', tint: 'var(--color-neutral-200)', text: 'var(--color-neutral-700)' },
    CANCELLED: { label: '已停課', color: 'oklch(58% 0.16 25)', tint: 'oklch(94% 0.045 25)', text: 'oklch(32% 0.1 25)' },
  };

  renderVals() {
    const { eligible, booked } = this.state;

    const courses = this.courseDefs.map(c => {
      const meta = this.statusMeta[c.status];
      const isBooked = !!booked[c.id];
      const bookable = c.status === 'OPEN' || c.status === 'WAITLIST_OPEN';
      const ended = c.status === 'ENDED' || c.status === 'CANCELLED';

      let primaryLabel, primaryEnabled;
      if (c.status === 'STARTED') { primaryLabel = '已開始'; primaryEnabled = false; }
      else if (c.status === 'ENDED') { primaryLabel = '已結束'; primaryEnabled = false; }
      else if (c.status === 'CANCELLED') { primaryLabel = '已停課'; primaryEnabled = false; }
      else if (c.status === 'WAITLIST_FULL') { primaryLabel = '候補已滿'; primaryEnabled = false; }
      else if (isBooked) { primaryLabel = c.status === 'WAITLIST_OPEN' ? '候補中' : '已預約'; primaryEnabled = false; }
      else { primaryLabel = c.status === 'WAITLIST_OPEN' ? '加入候補' : '預約這堂'; primaryEnabled = eligible; }

      return {
        title: c.title,
        branchCoach: c.branchCoach,
        statusLabel: meta.label,
        badgeStyle: `background:${meta.tint};color:${meta.text};`,
        borderColor: meta.color,
        opacity: ended ? 0.6 : 1,
        startTime: c.startTime,
        countdown: c.countdown,
        seats: `${c.confirmed}/${c.capacity}`,
        waitlist: c.wlCap ? `${c.wl}/${c.wlCap}` : '—',
        showNote: isBooked && bookable,
        noteText: c.status === 'WAITLIST_OPEN' ? `候補中，序號 ${c.wl}。` : '已預約，出席請提早 5 分鐘報到。',
        primaryEnabled: primaryEnabled,
        primaryDisabled: !primaryEnabled,
        primaryLabel,
        onPrimary: () => this.setState({ booked: { ...booked, [c.id]: true } }),
        showCancel: isBooked && bookable,
        onCancel: () => {
          const next = { ...booked };
          delete next[c.id];
          this.setState({ booked: next });
        },
      };
    });

    const noticeText = eligible
      ? '會籍生效中，到期日 2027年3月15日；預約權正常，記點 1/3。可直接預約下列課程。'
      : '會籍已凍結，需先恢復會籍才能預約課程；目前僅能查看課程列表。';

    return {
      courses,
      eligible,
      notEligible: !eligible,
      setEligible: () => this.setState({ eligible: true }),
      setNotEligible: () => this.setState({ eligible: false }),
      noticeText,
      noticeStyle: eligible
        ? 'background:oklch(94% 0.045 150);color:oklch(28% 0.09 150);'
        : 'background:color-mix(in srgb, var(--color-process-yellow) 16%, var(--color-bg));color:color-mix(in srgb, var(--color-process-yellow) 55%, var(--color-text));',
    };
  }
}

</script>
</body>
</html>
