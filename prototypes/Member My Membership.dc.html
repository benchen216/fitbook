<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/broadsheet-d1553512-e3b6-4d1d-9a99-c7008d70f65b/styles.css">
  <script src="_ds/broadsheet-d1553512-e3b6-4d1d-9a99-c7008d70f65b/_ds_bundle.js"></script>
  <style>body{margin:0;}</style>
</helmet>
<dc-import name="TopBar" variant="member" active-nav="我的會籍" member-name="王小明" hint-size="100%,60px"></dc-import>
<div style="max-width:900px;margin:0 auto;padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;gap:var(--space-6);font-family:var(--font-body);color:var(--color-text);box-sizing:border-box;">

  <section style="background:var(--color-neutral-50);border:1px solid var(--color-neutral-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4);">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);">
      <div style="display:flex;flex-direction:column;gap:5px;">
        <h2 style="margin:0;font-size:20px;">我的會籍</h2>
        <p style="margin:0;font-size:13px;color:var(--color-neutral-500);max-width:520px;">到期日與剩餘凍結次數依系統模擬時間即時計算；申請凍結或退會後，課程列表與預約頁會立即反映最新狀態。</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;color:var(--color-neutral-500);">示範狀態</span>
        <div class="seg" style="font-size:12px;">
          <label class="seg-opt"><input type="radio" name="mstatus" checked="{{ isActive }}" onChange="{{ setActive }}"></input>生效中</label>
          <label class="seg-opt"><input type="radio" name="mstatus" checked="{{ isFrozen }}" onChange="{{ setFrozen }}"></input>凍結中</label>
          <label class="seg-opt"><input type="radio" name="mstatus" checked="{{ isExpired }}" onChange="{{ setExpired }}"></input>已到期</label>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-3);">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
        <div class="card" style="border:1px solid var(--color-neutral-200);background:var(--color-bg);border-radius:var(--radius-lg);">
          <span style="font-size:11px;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:0.04em;">{{ t.label }}</span>
          <sc-if value="{{ t.isTag }}" hint-placeholder-val="{{ false }}">
            <span class="tag {{ t.tagClass }}" style="{{ t.tagStyle }};width:fit-content;">{{ t.value }}</span>
          </sc-if>
          <sc-if value="{{ t.isPlain }}" hint-placeholder-val="{{ true }}">
            <span style="font-family:var(--font-heading);font-size:18px;font-weight:600;">{{ t.value }}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ isFrozen }}" hint-placeholder-val="{{ false }}">
      <div style="{{ amberNoticeStyle }}">會籍已凍結：凍結期間到期日不會倒數，且無法預約課程；剩餘凍結次數 0/2。</div>
    </sc-if>
  </section>

  <section style="background:var(--color-neutral-50);border:1px solid var(--color-neutral-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4);">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);">
      <div style="display:flex;flex-direction:column;gap:5px;">
        <h2 style="margin:0;font-size:20px;">我的預約權</h2>
        <p style="margin:0;font-size:13px;color:var(--color-neutral-500);max-width:520px;">缺席（未報到）以最近 30 天內計算；達到 3 次將暫停預約權一段時間，停權期間仍可取消已預約課程。</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;color:var(--color-neutral-500);">示範狀態</span>
        <div class="seg" style="font-size:12px;">
          <label class="seg-opt"><input type="radio" name="bstatus" checked="{{ bookingOK }}" onChange="{{ setBookingOK }}"></input>正常</label>
          <label class="seg-opt"><input type="radio" name="bstatus" checked="{{ bookingSuspended }}" onChange="{{ setBookingSuspended }}"></input>停權</label>
        </div>
      </div>
    </div>

    <sc-if value="{{ bookingOK }}" hint-placeholder-val="{{ true }}">
      <div style="{{ greenNoticeStyle }}">預約權正常，最近 30 天記點 1/3。</div>
    </sc-if>
    <sc-if value="{{ bookingSuspended }}" hint-placeholder-val="{{ false }}">
      <div style="{{ redNoticeStyle }}">預約權已暫停，將於 2026年8月19日 09:00 恢復。</div>
    </sc-if>

    <div style="display:flex;gap:var(--space-4);flex-wrap:wrap;">
      <a href="Member Course List.dc.html" class="btn btn-ghost">去看課程</a>
      <span class="btn btn-ghost" style="opacity:0.45;cursor:not-allowed;pointer-events:none;" title="示範中尚未提供">看記點明細</span>
    </div>
  </section>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { membershipStatus: 'ACTIVE', bookingStatus: 'OK' };

  renderVals() {
    const { membershipStatus, bookingStatus } = this.state;
    const isActive = membershipStatus === 'ACTIVE';
    const isFrozen = membershipStatus === 'FROZEN';
    const isExpired = membershipStatus === 'EXPIRED';

    const statusTile = isActive
      ? { value: '生效中', tagClass: 'tag-accent', tagStyle: '' }
      : isFrozen
      ? { value: '凍結中', tagClass: '', tagStyle: `background:color-mix(in srgb, var(--color-process-yellow) 20%, var(--color-bg));color:color-mix(in srgb, var(--color-process-yellow) 65%, var(--color-text));` }
      : { value: '已到期', tagClass: 'tag-neutral', tagStyle: '' };

    const tiles = [
      { label: '方案', value: '年約 VIP', isPlain: true, isTag: false },
      { label: '狀態', value: statusTile.value, isPlain: false, isTag: true, tagClass: statusTile.tagClass, tagStyle: statusTile.tagStyle },
      { label: '到期日', value: isExpired ? '2025年11月2日' : '2027年3月15日', isPlain: true, isTag: false },
      { label: '剩餘凍結次數', value: isExpired ? '—' : (isFrozen ? '0/2' : '1/2'), isPlain: true, isTag: false },
    ];

    return {
      isActive, isFrozen, isExpired,
      setActive: () => this.setState({ membershipStatus: 'ACTIVE' }),
      setFrozen: () => this.setState({ membershipStatus: 'FROZEN' }),
      setExpired: () => this.setState({ membershipStatus: 'EXPIRED' }),
      tiles,
      amberNoticeStyle: `padding:12px 16px;border-radius:var(--radius-md);font-size:13px;background:color-mix(in srgb, var(--color-process-yellow) 16%, var(--color-bg));color:color-mix(in srgb, var(--color-process-yellow) 60%, var(--color-text));`,
      bookingOK: bookingStatus === 'OK',
      bookingSuspended: bookingStatus === 'SUSPENDED',
      setBookingOK: () => this.setState({ bookingStatus: 'OK' }),
      setBookingSuspended: () => this.setState({ bookingStatus: 'SUSPENDED' }),
      greenNoticeStyle: `padding:12px 16px;border-radius:var(--radius-md);font-size:13px;background:oklch(96% 0.035 150);color:oklch(30% 0.08 150);`,
      redNoticeStyle: `padding:12px 16px;border-radius:var(--radius-md);font-size:13px;background:oklch(96% 0.035 25);color:oklch(32% 0.1 25);`,
    };
  }
}

</script>
</body>
</html>
